<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#03070b">
<meta name="description" content="يوري عيسى — مساحة شخصية للأفكار والإبداع والتكنولوجيا والمشاريع.">
<title>يوري عيسى | Yuri Issa</title>
<style>
:root{--bg:#030609;--panel:#071017;--text:#f4f5f7;--muted:#aeb5bf;--orange:#ff7418;--orange2:#ffad32;--green:#76ef18;--line:#26323a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;overflow-x:hidden}a{color:inherit;text-decoration:none}
.site-header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 4%;background:#020406;border-bottom:1px solid #17212a;position:relative;z-index:5;direction:rtl}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;font-weight:900;font-size:20px}.brand-mark{width:45px;height:50px;filter:drop-shadow(0 0 7px #ff741866)}.brand-name span{color:var(--orange)}
.nav{display:flex;align-items:center;gap:24px;font-size:13px;color:#c3c9d0}.nav a{height:76px;display:flex;align-items:center;gap:7px;position:relative}.nav a:hover,.nav a.active{color:var(--orange)}.nav a.active:after{content:"";height:3px;position:absolute;bottom:8px;left:0;right:0;background:var(--orange);box-shadow:0 0 12px var(--orange)}
.menu-toggle{display:none;background:none;color:white;border:1px solid #38414a;border-radius:8px;padding:8px 12px;font-size:20px}
.hero{min-height:440px;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:42px 5%;background:#02070c url("hero-art.png") center center/cover no-repeat}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(1,5,9,.96) 0%,rgba(1,5,9,.82) 37%,rgba(1,5,9,.08) 72%,rgba(1,5,9,.05));z-index:0}
.hero-copy{position:relative;z-index:1;max-width:520px;text-align:right}.eyebrow{font-size:14px;color:var(--orange2);font-weight:900;letter-spacing:.4px;margin-bottom:17px}.hero h1{font-size:clamp(36px,5vw,60px);line-height:1.12;margin:0 0 14px;font-weight:900}.hero h1 span{display:block;color:var(--orange);font-size:1.1em}.hero-copy p{font-size:18px;line-height:1.7;color:#d0d5db;max-width:450px;margin:0 0 24px}
.glow-btn{display:inline-flex;align-items:center;gap:14px;border:2px solid var(--orange);border-radius:12px;padding:12px 20px;color:#ff9a36;font-weight:900;font-size:14px;box-shadow:0 0 10px #ff781b,inset 0 0 9px #ff781b44}
.hero-caption{position:absolute;bottom:17px;left:4%;font-size:10px;letter-spacing:2px;color:#a9b4c0;z-index:1}
.explore{padding:26px 3.4% 30px;background:linear-gradient(180deg,#030609,#020508)}.section-heading{display:flex;align-items:center;gap:13px;margin-bottom:18px}.slash{width:20px;height:17px;background:var(--orange);transform:skew(-27deg);box-shadow:0 0 12px #ff741866}.section-heading h2{font-size:22px;margin:0;font-weight:900}.heading-line{height:1px;flex:1;background:linear-gradient(90deg,#38414a,transparent)}.view-all{font-size:13px;color:var(--green);font-weight:900;white-space:nowrap}
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.feature{height:142px;position:relative;overflow:hidden;border:1px solid #a34d20;border-radius:13px;padding:15px;background:linear-gradient(135deg,#0c131b,#05090d 75%);box-shadow:inset 0 0 20px #ff74180a}.feature.green{border-color:#3e8f23;box-shadow:inset 0 0 20px #76ef180c}.num{font-size:22px;font-weight:900;color:var(--orange);margin-bottom:12px;direction:ltr;text-align:right}.feature.green .num{color:var(--green)}.feature h3{font-size:16px;margin:0 0 8px}.feature p{font-size:12px;line-height:1.5;color:#b9c0c8;margin:0;max-width:160px}.feature-icon{position:absolute;left:14px;top:45px;font-size:30px;color:var(--orange)}.feature.green .feature-icon{color:var(--green)}.corner{position:absolute;left:0;bottom:0;width:48px;height:28px;background:var(--orange);clip-path:polygon(0 0,65% 0,100% 100%,0 100%);display:flex;align-items:center;justify-content:flex-start;padding-left:8px;color:white}
.values{margin-top:21px;min-height:78px;border:1px solid #26313b;border-radius:13px;background:linear-gradient(100deg,#071019,#050a0f);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:12px 18px}.value{display:flex;align-items:center;justify-content:center;gap:12px;min-height:44px;border-left:1px solid #3a444d;color:#d0d5db;font-size:12px;line-height:1.4}.value:last-child{border:0}.value-icon{font-size:28px;color:var(--orange)}
.content-section{padding:70px 5%;border-top:1px solid #17232c;background:linear-gradient(120deg,#03080c,#071019)}.content-section h2{font-size:32px;margin:8px 0 12px}.kicker{color:var(--orange);font-size:12px;letter-spacing:1px;font-weight:900}.content-section p{color:var(--muted);line-height:1.9;max-width:780px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}.info-card{padding:24px;border:1px solid #29343e;border-radius:15px;background:linear-gradient(145deg,#0b1520,#05090d)}.info-card h3{margin:10px 0;color:#fff}.info-card p{font-size:14px}
.site-footer{border-top:3px solid var(--orange);padding:19px 3.4%;display:flex;align-items:center;justify-content:space-between;background:#020406;color:#aeb4bc;font-size:13px}.footer-brand{color:var(--orange);font-weight:900}.socials{display:flex;gap:10px}.socials a{width:31px;height:31px;border:1px solid #59616a;border-radius:50%;display:grid;place-items:center;color:#e6e9ec;font-weight:bold}.socials a:hover{border-color:var(--orange);color:var(--orange)}
@media(max-width:760px){.site-header{height:66px;padding:0 4%}.brand{font-size:16px}.brand-mark{width:36px;height:41px}.menu-toggle{display:block}.nav{display:none;position:absolute;top:65px;left:0;right:0;background:#030609;padding:10px 5% 18px;flex-wrap:wrap;gap:0 18px;border-bottom:1px solid #26323a}.nav.open{display:flex}.nav a{height:42px}.nav a.active:after{bottom:0}.hero{min-height:380px;padding:30px 4%;background-position:58% center}.hero:before{background:linear-gradient(90deg,rgba(1,5,9,.95),rgba(1,5,9,.72) 48%,rgba(1,5,9,.12))}.hero h1{font-size:clamp(32px,7vw,46px)}.hero-copy p{font-size:14px}.feature-grid{gap:8px}.feature{height:135px;padding:12px 10px}.feature h3{font-size:13px}.feature p{font-size:10px}.feature-icon{left:8px;font-size:23px}.values{padding:9px 5px}.value{font-size:9px;gap:6px}.value-icon{font-size:22px}.content-section{padding:52px 5%}.content-section h2{font-size:27px}.cards{grid-template-columns:1fr}}
@media(max-width:430px){.hero{min-height:430px;grid-template-columns:1fr;background-position:61% center}.hero:before{background:linear-gradient(90deg,rgba(1,5,9,.94),rgba(1,5,9,.74) 58%,rgba(1,5,9,.3))}.hero-copy{max-width:90%}.hero h1{font-size:40px}.hero-copy p{max-width:290px}.feature-grid{grid-template-columns:repeat(2,1fr)}.feature{height:138px}.values{grid-template-columns:repeat(2,1fr);gap:6px}.value:nth-child(2){border:0}.value{justify-content:flex-start;padding:6px 9px}.site-footer{gap:12px;flex-wrap:wrap}.socials{margin-right:auto}}
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="#home" aria-label="العودة إلى الرئيسية">
    <svg class="brand-mark" viewBox="0 0 64 72" aria-label="شعار YURI ISSA">
      <defs><linearGradient id="miniMetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd47a"/><stop offset=".45" stop-color="#ff7418"/><stop offset="1" stop-color="#9d3509"/></linearGradient></defs>
      <path d="M7 8 L32 2 L57 8 L54 42 Q48 59 32 68 Q16 59 10 42 Z" fill="#080e13" stroke="url(#miniMetal)" stroke-width="5"/>
      <path d="M18 22 L32 43 L46 22 M32 43 L32 57" fill="none" stroke="#ff941e" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
      <circle cx="32" cy="18" r="3.7" fill="#76ef18" filter="drop-shadow(0 0 3px #76ef18)"/>
    </svg>
    <span class="brand-name" id="brand"></span>
  </a>
  <button class="menu-toggle" aria-label="فتح القائمة" onclick="document.querySelector('.nav').classList.toggle('open')">☰</button>
  <nav class="nav" id="nav"></nav>
</header>
<main>
<section class="hero" id="home">
  <div class="hero-copy"><div class="eyebrow" id="welcome"></div><h1><span id="hello" style="color:#fff;font-size:.72em"></span><span id="name"></span></h1><p id="tagline"></p><a class="glow-btn" href="#about"><span id="discover"></span><span>➜</span></a></div>
  <div class="hero-caption" id="identity"></div>
</section>
<section class="explore" id="explore">
  <div class="section-heading"><span class="slash"></span><h2 id="exploreTitle"></h2><span class="heading-line"></span><a class="view-all" href="#about" id="viewAll"></a></div>
  <div class="feature-grid" id="features"></div><div class="values" id="values"></div>
</section>
<section class="content-section" id="about"><div class="kicker" id="aboutKicker"></div><h2 id="aboutTitle"></h2><p id="aboutText"></p></section>
<section class="content-section" id="projects"><div class="kicker" id="projectsKicker"></div><h2 id="projectsTitle"></h2><div class="cards" id="projectsCards"></div></section>
<section class="content-section" id="articles"><div class="kicker" id="articlesKicker"></div><h2 id="articlesTitle"></h2><p id="articlesText"></p></section>
<section class="content-section" id="gallery"><div class="kicker" id="galleryKicker"></div><h2 id="galleryTitle"></h2><p id="galleryText"></p></section>
<section class="content-section" id="contact"><div class="kicker" id="contactKicker"></div><h2 id="contactTitle"></h2><p id="contactText"></p><a class="glow-btn" href="https://github.com/yuriissa" target="_blank" rel="noopener" id="githubText"></a></section>
</main>
<footer class="site-footer"><div id="copyright"></div><div class="socials"><a href="https://github.com/yuriissa" aria-label="GitHub">◉</a><a href="#contact" aria-label="LinkedIn">in</a><a href="#contact" aria-label="X">X</a></div></footer>
<script src="content.js"></script>
<script>
const c=window.YURI_CONTENT;
const put=(id,value)=>document.getElementById(id).textContent=value;
put('brand',c.brand);put('welcome',c.welcome);put('hello',c.hello);put('name',c.name);put('tagline',c.tagline);put('discover',c.discover);put('identity',c.identity);put('exploreTitle',c.explore);put('viewAll',c.viewAll+' ➜');
put('aboutKicker',c.aboutKicker);put('aboutTitle',c.aboutTitle);put('aboutText',c.aboutText);
put('projectsKicker',c.projectsKicker);put('projectsTitle',c.projectsTitle);
put('articlesKicker',c.articlesKicker);put('articlesTitle',c.articlesTitle);put('articlesText',c.articlesText);
put('galleryKicker',c.galleryKicker);put('galleryTitle',c.galleryTitle);put('galleryText',c.galleryText);
put('contactKicker',c.contactKicker);put('contactTitle',c.contactTitle);put('contactText',c.contactText);put('githubText',c.githubText);put('copyright',c.copyright);
document.getElementById('nav').innerHTML=c.nav.map((n,i)=>`<a class="${i===0?'active':''}" href="${n[1]}">${n[0]}</a>`).join('');
document.getElementById('features').innerHTML=c.features.map((f,i)=>`<a class="feature ${i%2?'green':''}" href="${f.href}"><div class="num">${f.number}</div><h3>${f.title}</h3><p>${f.description}</p><span class="feature-icon">${f.icon}</span><span class="corner">➜</span></a>`).join('');
document.getElementById('values').innerHTML=c.values.map(v=>`<div class="value"><span class="value-icon">${v[0]}</span><span>${v[1]}<br>${v[2]}</span></div>`).join('');
document.getElementById('projectsCards').innerHTML=c.projects.map(p=>`<article class="info-card"><h3>${p.title}</h3><p>${p.description}</p>${p.link?`<a class="view-all" href="${p.link}" target="_blank" rel="noopener">${p.linkText}</a>`:''}</article>`).join('');
document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>document.querySelector('.nav').classList.remove('open')));
</script>
</body>
</html>
