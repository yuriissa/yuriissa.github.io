name: Website navigation test

on:
  push:
    branches:
      - site-expansion
  workflow_dispatch:

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local website server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/yuri-site.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html > /dev/null; then
              break
            fi
            sleep 1
          done

      - name: Test navigation buttons on desktop and mobile sizes
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              { label: 'VIEW PROJECTS ↗', href: 'projects.html', heading: 'Personal Projects' },
              { label: 'VIEW DESIGNS ↗', href: 'designs.html', heading: 'My Designs' },
              { label: 'VIEW ARTICLES ↗', href: 'articles.html', heading: 'Articles & Insights' }
            ];

            try {
              for (const viewport of [
                { name: 'desktop', width: 1365, height: 900 },
                { name: 'mobile', width: 390, height: 844 }
              ]) {
                const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
                const pageErrors = [];
                page.on('pageerror', error => pageErrors.push(error.message));

                const response = await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle' });
                if (!response || !response.ok()) throw new Error('Homepage did not load for ' + viewport.name);

                for (const item of cases) {
                  const link = page.locator('#projects .info-card a').filter({ hasText: item.label });
                  if (await link.count() !== 1) {
                    throw new Error('Button missing or duplicated: ' + item.label + ' (' + viewport.name + ')');
                  }
                  const actualHref = await link.getAttribute('href');
                  if (actualHref !== item.href) {
                    throw new Error('Wrong href for ' + item.label + ': ' + actualHref);
                  }

                  await link.click();
                  await page.waitForURL(url => url.pathname.endsWith('/' + item.href));
                  const heading = (await page.locator('main h1').first().innerText()).trim();
                  if (heading !== item.heading) {
                    throw new Error('Wrong destination heading for ' + item.label + ': ' + heading);
                  }
                  console.log('PASS [' + viewport.name + '] ' + item.label + ' -> ' + item.href + ' (' + heading + ')');

                  await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle' });
                }

                if (pageErrors.length) {
                  throw new Error('JavaScript errors on ' + viewport.name + ': ' + pageErrors.join(' | '));
                }
                await page.close();
              }
              console.log('ALL NAVIGATION TESTS PASSED');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
